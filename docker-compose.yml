services:
  web:
    # step-5a: build from the local Dockerfile and publish port 3000.
    build: .
    ports:
      - "3000:3000"

    # step-5b: point the app at the `db` service (value from .env.example).
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/workshop

    # step-5c: don't start until Postgres reports healthy.
    depends_on:
      db:
        condition: service_healthy

  db:
    # step-5d: pinned Postgres with a pg_isready healthcheck.
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workshop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

    # step-5e: named volume for the data directory.
    # step-5g: seed script, mounted read-only.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    # step-5f: create the DB and user on first startup.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workshop

# step-5h: named volume declaration.
volumes:
  pgdata:
