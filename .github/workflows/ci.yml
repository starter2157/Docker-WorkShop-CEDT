name: CI

# step-6a: run on every push to main.
on:
  push:
    branches: [main]

env:
  IMAGE_NAME: workshop-app

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # step-6b: build locally. --load puts the image in the daemon's store so
      # Trivy can resolve image-ref in the next step (buildx would otherwise
      # leave it in the build cache only).
      - name: Build image
        run: docker build --load -t $IMAGE_NAME:${{ github.sha }} .

      # scan the freshly built image with Trivy. Fail the job on CRITICAL.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # log in to Docker Hub using DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # step-6e: push both :latest and the immutable :<sha> tag.
      - name: Tag and push
        run: |
          FULL=${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME
          docker tag $IMAGE_NAME:${{ github.sha }} $FULL:${{ github.sha }}
          docker tag $IMAGE_NAME:${{ github.sha }} $FULL:latest
          docker push $FULL:${{ github.sha }}
          docker push $FULL:latest
